name: pr_ci
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "TESTING.md"
      - ".github/workflows/pr_ci.yaml"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "TESTING.md"
      - ".github/workflows/pr_ci.yaml"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Run PR check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: go mod download

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          only-new-issues: true

      - name: Check Swagger docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.5
          make docs
          git diff --exit-code docs/

      - name: Run tests and show coverage
        run: make test-cover
